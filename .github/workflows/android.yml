name: Build Maxim Boost Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ditemukan file ZIP proyek Android."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: ZIP tidak berisi settings.gradle atau settings.gradle.kts."
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Align Java and Kotlin JVM targets to 17
        shell: bash
        run: |
          set -e
          APP_GRADLE="$(find "$PROJECT_DIR" -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' | head -n 1)"
          if [ -n "$APP_GRADLE" ]; then
            python3 - "$APP_GRADLE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          # Update common Java 8 target declarations to Java 17.
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace("JavaVersion.VERSION_8", "JavaVersion.VERSION_17")
          s = re.sub(r"(sourceCompatibility\s*=\s*)['\"]1\.8['\"]", r"\g<1>17", s)
          s = re.sub(r"(targetCompatibility\s*=\s*)['\"]1\.8['\"]", r"\g<1>17", s)
          # Update Kotlin JVM target if it is explicitly set.
          s = re.sub(r"(jvmTarget\s*=\s*)['\"](?:1\.8|8)['\"]", r"\g<1>'17'", s)
          p.write_text(s)
          print("Updated", p)
          PY
          else
            echo "No app/build.gradle found; continuing without patch."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maxim-boost-pro-debug-apk
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
